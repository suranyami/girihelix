name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.3"
  OTP_VERSION: "29.0.5"
  # The arm64 image build runs on the homelab Buildkite agent. Set these to your
  # Buildkite org slug and pipeline slug.
  BUILDKITE_ORG: suranyami-3
  BUILDKITE_PIPELINE: girihelix

jobs:
  test:
    name: Test and gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: girihelix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      # The same gate the pre-push hook runs: compile with warnings as errors,
      # format, credo, dialyzer, sobelow and the suite under coverage.
      - name: Run precommit
        run: mix precommit

      # The arm64 image build runs on the homelab Buildkite agent natively —
      # see .buildkite/pipeline.yml. It is triggered here rather than by its own
      # webhook so it keeps the old `needs: test` gate: a red suite never
      # publishes. Pull requests pass PUSH=false, which preserves the previous
      # behaviour of validating the Dockerfile without pushing an image.
      - name: Trigger arm64 image build
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          curl -fsS -X POST \
            "https://api.buildkite.com/v2/organizations/${BUILDKITE_ORG}/pipelines/${BUILDKITE_PIPELINE}/builds" \
            -H "Authorization: Bearer ${BUILDKITE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$COMMIT" --arg b "$BRANCH" --arg p "$PUSH" \
                  '{commit:$c, branch:$b, env:{PUSH:$p}}')"
