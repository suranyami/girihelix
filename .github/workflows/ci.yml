name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A nightly run exercises the suite even in a quiet week. The image build is
  # skipped for scheduled runs, so this never publishes.
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.3"
  OTP_VERSION: "29.0.5"
  # The arm64 image build runs on the homelab Buildkite agent. Set these to your
  # Buildkite org slug and pipeline slug.
  BUILDKITE_ORG: suranyami-3
  BUILDKITE_PIPELINE: girihelix

jobs:
  test:
    name: Test and gates
    runs-on: ubuntu-latest
    # The image build runs under QEMU on the arm64 agent, so this job also waits
    # for it. 120 minutes leaves margin over the 90-minute Buildkite timeout.
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: girihelix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      # The same gate the pre-push hook runs: compile with warnings as errors,
      # format, credo, dialyzer, sobelow and the suite under coverage.
      - name: Run precommit
        run: mix precommit

      # The multi-arch image build runs on the homelab Buildkite agent — see
      # .buildkite/pipeline.yml. It is triggered here rather than by its own
      # webhook so it keeps the test gate, and the wait below makes this GitHub
      # check red when Buildkite fails. Pull requests pass PUSH=false, which
      # validates the Dockerfile without pushing an image.
      - name: Trigger image build
        id: buildkite
        if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          response=$(curl -fsS -X POST \
            "https://api.buildkite.com/v2/organizations/${BUILDKITE_ORG}/pipelines/${BUILDKITE_PIPELINE}/builds" \
            -H "Authorization: Bearer ${BUILDKITE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$COMMIT" --arg b "$BRANCH" --arg p "$PUSH" \
                  '{commit:$c, branch:$b, env:{PUSH:$p}}')")

          echo "$response" | jq -r '"Buildkite build: " + .web_url'
          echo "number=$(echo "$response" | jq -r '.number')" >> "$GITHUB_OUTPUT"

      - name: Wait for the Buildkite image build
        if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          BUILD_NUMBER: ${{ steps.buildkite.outputs.number }}
        run: |
          deadline=$((SECONDS + 6600))

          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(curl -fsS \
              -H "Authorization: Bearer ${BUILDKITE_TOKEN}" \
              "https://api.buildkite.com/v2/organizations/${BUILDKITE_ORG}/pipelines/${BUILDKITE_PIPELINE}/builds/${BUILD_NUMBER}" |
              jq -r '.state')

            echo "Buildkite build ${BUILD_NUMBER}: ${state}"

            case "$state" in
              passed) exit 0 ;;
              failed | canceled | skipping | not_run)
                echo "::error::Buildkite build ${BUILD_NUMBER} ${state}"
                exit 1
                ;;
            esac

            sleep 30
          done

          echo "::error::Timed out waiting for Buildkite build ${BUILD_NUMBER}"
          exit 1
